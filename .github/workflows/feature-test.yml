# Проверка новых функций на настоящей Windows: OCR, «Скрыть», хуки ввода и пошаговая инструкция целиком.
# Результаты (лог, картинки, буфер обмена) — в ветку ci-feature-test.
name: Feature test (Windows)

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tools/FeatureTest/**', '.github/workflows/feature-test.yml']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - name: Build
        shell: bash
        run: |
          dotnet build -c Release src/SnapMark.App
          dotnet build -c Release tools/FeatureTest
      - name: ffmpeg and a test video
        shell: bash
        run: |
          ffmpeg -version >/dev/null 2>&1 || choco install ffmpeg -y --no-progress
          mkdir -p out
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac "$PWD/out/test.mp4"
          ls -la out
      - name: Unit-style checks (OCR, redact, input hooks)
        shell: bash
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p out
          export SNAPMARK_TEST_INPUT=1
          export SNAPMARK_TEST_VIDEO="$PWD/out/test.mp4"
          dotnet tools/FeatureTest/bin/Release/net8.0/FeatureTest.dll "$PWD/out" 2>&1 | tee out/feature-test.txt
      - name: PrtSc right after start
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $env:SNAPMARK_TEST_INPUT = '1'
          $exe = (Resolve-Path 'src/SnapMark.App/bin/Release/net8.0/SnapMark.exe').Path
          # Как у пользователя: «Ножницы» включены, SnapMark сам управляет этой настройкой.
          New-Item -Path 'HKCU:\Software\SnapMark' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\SnapMark' -Name RestorePrintScreenSnipping -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKCU:\Control Panel\Keyboard' -Name PrintScreenKeyForSnippingEnabled -Value 1 -Type DWord
          Add-Type -Namespace K -Name U -MemberDefinition @'
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, IntPtr extra);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public struct RECT { public int L, T, R, B; }
          '@
          Add-Type -AssemblyName System.Windows.Forms
          New-Item -ItemType Directory -Force out | Out-Null
          $w = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
          for ($run = 1; $run -le 2; $run++) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $app = Start-Process $exe -PassThru
            $found = $false
            while ($sw.Elapsed.TotalSeconds -lt 30 -and -not $found) {
              Start-Sleep -Milliseconds 250
              [K.U]::keybd_event(0x2C, 0, 0, [IntPtr]::Zero); [K.U]::keybd_event(0x2C, 0, 2, [IntPtr]::Zero)
              Start-Sleep -Milliseconds 150
              $r = New-Object K.U+RECT
              [K.U]::GetWindowRect([K.U]::GetForegroundWindow(), [ref]$r) | Out-Null
              $fgPid = [uint32]0
              [K.U]::GetWindowThreadProcessId([K.U]::GetForegroundWindow(), [ref]$fgPid) | Out-Null
              if (($r.R - $r.L) -ge $w -and $app.Id -eq $fgPid) { $found = $true }
            }
            $kb = (Get-ItemProperty 'HKCU:\Control Panel\Keyboard').PrintScreenKeyForSnippingEnabled
            "run ${run}: overlay after $([math]::Round($sw.Elapsed.TotalSeconds,1)) s found=$found snipping=$kb" | Tee-Object -Append out/prtsc-startup.txt
            Stop-Process -Id $app.Id -Force; Start-Sleep -Seconds 2
          }
      - name: End-to-end step guide
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Continue'
          $env:SNAPMARK_TEST_INPUT = '1'
          $exe = (Resolve-Path 'src/SnapMark.App/bin/Release/net8.0/SnapMark.exe').Path
          Add-Type -Namespace W -Name U -MemberDefinition @'
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, int x, int y, uint d, IntPtr e);
          '@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function Click($x, $y) { [W.U]::SetCursorPos($x, $y) | Out-Null; Start-Sleep -Milliseconds 80; [W.U]::mouse_event(2,0,0,0,[IntPtr]::Zero); [W.U]::mouse_event(4,0,0,0,[IntPtr]::Zero) }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          Shot 'e2e-0-started'
          & $exe --steps
          Start-Sleep -Seconds 3
          Shot 'e2e-1-steps-on'
          Click 260 620; Start-Sleep -Milliseconds 1500
          Click 900 450; Start-Sleep -Milliseconds 1500
          Click 1250 700; Start-Sleep -Milliseconds 2500
          Shot 'e2e-2-after-clicks'
          & $exe --steps
          Start-Sleep -Seconds 5
          Shot 'e2e-3-done'
          # В PowerShell 7 у Get-Clipboard нет -Format — буфер читаем через Windows PowerShell (STA).
          powershell.exe -NoProfile -STA -Command "Get-Clipboard -Format Text" | Out-File -Encoding utf8 out/clipboard.txt
          $files = powershell.exe -NoProfile -STA -Command "Get-Clipboard -Format FileDropList | ForEach-Object { `$_.FullName }"
          "files: $(@($files).Count)" | Out-File -Append -Encoding utf8 out/clipboard.txt
          foreach ($f in @($files)) { if ($f) { Copy-Item $f ("out/step-" + (Split-Path $f -Leaf)) } }
          $steps = Join-Path $env:TEMP 'SnapMark/steps.log'
          if (Test-Path $steps) { Copy-Item $steps out/steps.log }
          Get-Content out/clipboard.txt
          Get-ChildItem out
          $log = Join-Path $env:APPDATA 'SnapMark/error.log'
          if (Test-Path $log) { Copy-Item $log out/error.log }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      - name: Publish results
        if: always()
        shell: bash
        run: |
          cd out
          git init -q -b ci-feature-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Feature test ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-feature-test
