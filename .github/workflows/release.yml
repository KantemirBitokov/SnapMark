# Сборка SnapMark для Windows, macOS и Linux на серверах GitHub (Mac и Linux у себя не нужны).
#
# Запуск: вкладка Actions → «Build SnapMark» → Run workflow.
# Или автоматически при теге версии:  git tag v1.0.0 && git push --tags
#   — тогда файлы сразу прикрепляются к GitHub Release.
#
# Подпись для macOS (необязательно): добавь секреты репозитория
#   MACOS_CERT_P12 (base64 от .p12 «Developer ID Application»), MACOS_CERT_PASSWORD,
#   MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
# Без них .app подписывается «ad-hoc» — запускается через ПКМ → «Открыть».
name: Build SnapMark

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./build-release.ps1
      - uses: actions/upload-artifact@v4
        with: { name: SnapMark-Windows, path: release/* }

  macos:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          xcrun notarytool store-credentials snapmark --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> $GITHUB_ENV
          echo "NOTARY_PROFILE=snapmark" >> $GITHUB_ENV
      - name: Build
        run: bash ./build-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: SnapMark-macOS, path: release/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build
        run: bash ./build-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: SnapMark-Linux, path: release/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
