# Уборка: удаляет рабочие ветки feature/* и fix/*, которые уже целиком влиты в main, и одноразовые
# ветки экспериментов probe/* и test/* (замеры, сравнения — в main их не вливают).
# Ветки с невлитыми изменениями и служебные ci-* не трогает. Запуск вручную: Actions → Cleanup branches → Run workflow.
name: Cleanup branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Delete merged feature/fix branches
        shell: bash
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -E '^(feature|fix)/'); do
            if git merge-base --is-ancestor "origin/$ref" origin/main; then
              echo "delete  $ref"
              git push -q origin --delete "$ref"
            else
              echo "keep    $ref (has commits not in main)"
            fi
          done
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -E '^(probe|test)/'); do
            echo "delete  $ref (experiment)"
            git push -q origin --delete "$ref"
          done
          # Служебные ci-* ветки, в которые больше не пишет ни один workflow (остались от экспериментов).
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -E '^ci-'); do
            if grep -rqF "$ref" .github/workflows; then
              echo "keep    $ref (used by a workflow)"
            else
              echo "delete  $ref (no workflow writes to it)"
              git push -q origin --delete "$ref"
            fi
          done
